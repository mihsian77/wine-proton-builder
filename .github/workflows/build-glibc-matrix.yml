name: Build Wine glibc (Winlator 11.2)

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Wine 版本列表，逗号分隔（对应上游 tag wine-<ver>）'
        required: true
        default: '11.22'
      jobs:
        description: '编译线程数'
        required: false
        default: '4'
      profile:
        description: '补丁档位：core=仅路径修正；enhanced=路径修正+平台增强补丁集'
        required: false
        default: 'core'
        type: choice
        options: [core, enhanced]
      publish_release:
        description: '构建成功后发布 Release（tag: wine-<ver>-glibc[-enhanced]）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          vs = [v.strip() for v in os.environ["VERSIONS"].split(",") if v.strip()]
          print("matrix=" + json.dumps({"version": vs}))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Fetch Wine source
        run: |
          git init src
          cd src
          git remote add origin https://github.com/wine-mirror/wine.git
          git fetch --depth 1 origin "refs/tags/wine-${{ matrix.version }}"
          git checkout FETCH_HEAD
          echo "source: $(cat VERSION)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex pkg-config \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64 \
            gettext zstd xz-utils unzip \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libvulkan-dev libsdl2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev libgstreamer-plugins-bad1.0-dev \
            libunwind-dev libasound2-dev libpulse-dev libgnutls28-dev libmpg123-dev \
            libopenal-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev liblcms2-dev \
            libxml2-dev libxslt1-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxrender-dev libkrb5-dev libgssapi-krb5-2 krb5-config

      - name: Apply Winlator path patch
        run: |
          cd src
          patch -p1 --forward < ../patches/winlator-glibc-paths.patch
          grep -n 'com.winlator' server/request.c dlls/ntdll/unix/server.c server/unicode.c

      - name: Apply enhanced patch set
        if: inputs.profile == 'enhanced'
        run: |
          cd src
          for p in ../patches/enhanced/*.patch; do
            echo "== $(basename "$p")"
            patch -p1 --forward < "$p"
          done

      - name: Preflight
        run: |
          fail=0
          for c in flex bison msgfmt make x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc; do
            command -v "$c" >/dev/null 2>&1 || { echo "MISS $c"; fail=1; }
          done
          exit $fail

      - name: Build Wine
        run: |
          bash scripts/build-wine.sh \
            --srcdir "${{ github.workspace }}/src" \
            --prefix /tmp/wine_build \
            --builddir /tmp/wine-build-tree \
            --jobs "${{ inputs.jobs }}"

      - name: Package
        run: |
          SUFFIX=""
          [ "${{ inputs.profile }}" = "enhanced" ] && SUFFIX="-enhanced"
          NAME="wine-${{ matrix.version }}-x86_64-glibc${SUFFIX}"
          {
            echo "version: ${{ matrix.version }}"
            echo "upstream: wine-mirror/wine tag wine-${{ matrix.version }}"
            echo "source_commit: $(git -C src rev-parse HEAD)"
            echo "profile: ${{ inputs.profile }}"
            echo "base_patch: winlator-glibc-paths.patch sha256=$(sha256sum patches/winlator-glibc-paths.patch | cut -d' ' -f1)"
            if [ "${{ inputs.profile }}" = "enhanced" ]; then
              echo "enhanced_patches:"
              for p in patches/enhanced/*.patch; do
                echo "  $(basename "$p") sha256=$(sha256sum "$p" | cut -d' ' -f1)"
              done
            fi
            echo "host_gcc: $(gcc -dumpfullversion)"
            echo "mingw_gcc: $(x86_64-w64-mingw32-gcc -dumpfullversion)"
            echo "unix_ldflags: -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/wine_build/BUILD_INFO.txt
          tar -C /tmp/wine_build -cJf "${NAME}.tar.xz" .
          sha256sum "${NAME}.tar.xz" | tee "${NAME}.tar.xz.sha256"
          echo "files:" && ls -lh "${NAME}".*

      - name: Publish release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUFFIX=""
          [ "${{ inputs.profile }}" = "enhanced" ] && SUFFIX="-enhanced"
          TAG="wine-${{ matrix.version }}-glibc${SUFFIX}"
          cp /tmp/wine_build/BUILD_INFO.txt "wine-${{ matrix.version }}-x86_64-glibc${SUFFIX}.BUILD_INFO.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
          else
            gh release create "$TAG" \
              --title "Wine ${{ matrix.version }} x86_64 glibc${SUFFIX}" \
              --notes "版本 ${{ matrix.version }}，档位 ${{ inputs.profile }}。资产为编译树、校验和与构建清单。" \
              "wine-${{ matrix.version }}-x86_64-glibc${SUFFIX}.tar.xz" \
              "wine-${{ matrix.version }}-x86_64-glibc${SUFFIX}.tar.xz.sha256" \
              "wine-${{ matrix.version }}-x86_64-glibc${SUFFIX}.BUILD_INFO.txt"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-${{ matrix.version }}-x86_64-glibc${{ inputs.profile == 'enhanced' && '-enhanced' || '' }}
          path: |
            wine-${{ matrix.version }}-x86_64-glibc*.tar.xz
            wine-${{ matrix.version }}-x86_64-glibc*.tar.xz.sha256
          retention-days: 14
