name: Build Wine

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Wine 版本列表，逗号分隔（上游 tag wine-<ver>）'
        required: true
        default: '11.22'
      profile:
        description: '补丁档位：core=路径修正；enhanced=路径修正+增强补丁集'
        required: false
        default: 'enhanced'
        type: choice
        options: [core, enhanced]
      publish:
        description: '构建成功后发布 Release（github-actions[bot] 名义）'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '发布时标记为预发布（自动构建/未真机验证）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          vs = [v.strip() for v in os.environ["VERSIONS"].split(",") if v.strip()]
          print("matrix=" + json.dumps({"version": vs}))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Fetch Wine source
        run: |
          git init src
          cd src
          git remote add origin https://github.com/wine-mirror/wine.git
          git fetch --depth 1 origin "refs/tags/wine-${{ matrix.version }}"
          git checkout FETCH_HEAD
          echo "source: $(cat VERSION)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex pkg-config \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64 \
            gettext zstd xz-utils unzip xvfb \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libvulkan-dev libsdl2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev libgstreamer-plugins-bad1.0-dev \
            libunwind-dev libasound2-dev libpulse-dev libgnutls28-dev libmpg123-dev \
            libopenal-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev liblcms2-dev \
            libxml2-dev libxslt1-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxrender-dev libkrb5-dev libgssapi-krb5-2 krb5-config

      - name: Apply patches
        run: |
          cd src
          patch -p1 --forward < patches/winlator-glibc-paths.patch
          grep -n 'com.winlator' server/request.c dlls/ntdll/unix/server.c server/unicode.c
          if [ "${{ inputs.profile }}" = "enhanced" ]; then
            for p in ../patches/enhanced/*.patch; do
              echo "== $(basename "$p")"
              patch -p1 --forward < "$p"
            done
          fi

      - name: Preflight
        run: |
          fail=0
          for c in flex bison msgfmt make x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc xvfb-run; do
            command -v "$c" >/dev/null 2>&1 || { echo "MISS $c"; fail=1; }
          done
          exit $fail

      - name: Build Wine
        run: |
          bash scripts/build.sh \
            --srcdir "${{ github.workspace }}/src" \
            --prefix /tmp/wine_build \
            --builddir /tmp/wine-build-tree \
            --jobs "4"

      - name: Generate prefixPack
        run: |
          bash scripts/gen-prefixpack.sh \
            --wine-prefix /tmp/wine_build \
            --output /tmp/prefixPack.tar \
            --workdir /tmp/prefixwork
          tar -tf /tmp/prefixPack.tar | head -5

      - name: Package whp + wcp
        run: |
          V="${{ matrix.version }}"
          bash scripts/package-whp.sh /tmp/wine_build /tmp/prefixPack.tar \
            "wine-${V}-x86_64.whp" "$V" x86_64
          bash scripts/package-wcp.sh /tmp/wine_build /tmp/prefixPack.tar \
            "wine-${V}-x86_64.wcp" "$V" x86_64
          ls -lh wine-${V}-*

      - name: Release notes
        run: |
          bash scripts/release-notes.sh "${{ matrix.version }}" \
            "${{ inputs.profile }}" "whp wcp" > notes.md
          echo ".... 摘要 ...."; head -30 notes.md

      - name: Checksums
        run: |
          V="${{ matrix.version }}"
          sha256sum wine-${V}-x86_64.whp wine-${V}-x86_64.wcp > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-${{ matrix.version }}-x86_64
          path: |
            wine-${{ matrix.version }}-x86_64.whp
            wine-${{ matrix.version }}-x86_64.wcp
            notes.md
            SHA256SUMS.txt
          retention-days: 14

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ matrix.version }}"
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            TAG="wine-${V}-auto"
            FLAG="--prerelease"
          else
            TAG="wine-${V}"
            FLAG=""
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
          else
            gh release create "$TAG" $FLAG \
              --title "Wine ${V}" \
              --notes-file notes.md \
              "wine-${V}-x86_64.whp" "wine-${V}-x86_64.wcp" "SHA256SUMS.txt"
          fi
