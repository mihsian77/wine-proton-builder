name: Build Wine (Winlator)

on:
  workflow_dispatch:
    inputs:
      wine_repo:
        description: 'Wine 源码仓库（需含 Winlator 兼容补丁）'
        required: true
        default: 'wine-mirror/wine'
        type: string
      refs:
        description: '要构建的 ref，逗号分隔；可填分支/tag/commit，多个版本会并行编译'
        required: true
        default: 'wine-11.22'
        type: string
      wine_version:
        description: 'ref 不含版本号时（如 main/SHA）使用的版本名'
        required: false
        default: '11.22'
        type: string
      jobs:
        description: '每个构建的编译线程数'
        required: false
        default: '2'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: Resolve refs to build matrix
        id: m
        env:
          REFS: ${{ inputs.refs || 'main' }}
          FALLBACK_VERSION: ${{ inputs.wine_version || '10.17' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          refs = [r.strip() for r in os.environ["REFS"].split(",") if r.strip()]
          fallback = os.environ.get("FALLBACK_VERSION") or "10.17"
          items = []
          for ref in refs:
              name = re.sub(r'^(wine-|v)', '', ref)
              # main/master/纯 SHA 不携带版本信息，用 fallback
              if not re.match(r'^\d+\.\d+', name) or len(ref) >= 20:
                  name = fallback
              items.append({"ref": ref, "ver": name})
          print("matrix=" + json.dumps({"include": items}))
          PY

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout Wine source
        id: src
        run: |
          git init src
          cd src
          git remote add origin "https://github.com/${{ inputs.wine_repo }}.git"
          git fetch --depth 1 origin "${{ matrix.ref }}"
          git checkout FETCH_HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=${{ matrix.ref }} sha=$(git rev-parse --short HEAD)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex pkg-config \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64 \
            gettext zstd xz-utils xvfb unzip \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev \
            libvulkan-dev libsdl2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-good1.0-dev libgstreamer-plugins-bad1.0-dev \
            libunwind-dev libasound2-dev libpulse-dev libgnutls28-dev libmpg123-dev \
            libopenal-dev libpng-dev libjpeg-dev libtiff-dev libwebp-dev liblcms2-dev \
            libxml2-dev libxslt1-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxrender-dev libkrb5-dev libgssapi-krb5-2 krb5-config

      - name: Preflight
        run: |
          fail=0
          for c in flex bison msgfmt make x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc \
                   x86_64-w64-mingw32-strip i686-w64-mingw32-strip zstd xz xvfb-run; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '  OK   %-28s %s\n' "$c" "$(command -v "$c")"
            else
              printf '  MISS %-28s\n' "$c"; fail=1
            fi
          done
          pkg-config --exists gstreamer-1.0 && echo '  OK   gstreamer-1.0' || { echo '  MISS gstreamer-1.0'; fail=1; }
          exit $fail

      - name: Download CJK fonts
        run: |
          mkdir -p fonts
          curl -sSL -o /tmp/noto.zip "https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/08_NotoSansCJKsc.zip"
          unzip -q -o /tmp/noto.zip -d /tmp/noto || true
          find /tmp/noto -name '*.otf' -exec cp {} fonts/ \;
          COUNT=$(ls fonts/*.otf 2>/dev/null | wc -l)
          echo "  fonts: ${COUNT}"
          [ "${COUNT}" -gt 0 ] || { echo "ERROR: 中文字体下载失败"; exit 1; }

      - name: Restore compiled install
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/wine_build
          key: wine-install-${{ inputs.wine_repo }}-${{ steps.src.outputs.sha }}-j${{ inputs.jobs }}

      - name: Build Wine
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-wine.sh \
            --srcdir "${{ github.workspace }}/src" \
            --prefix /tmp/wine_build \
            --builddir /tmp/wine-build-tree \
            --jobs "${{ inputs.jobs }}"

      - name: Save compiled install
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/wine_build
          key: wine-install-${{ inputs.wine_repo }}-${{ steps.src.outputs.sha }}-j${{ inputs.jobs }}

      - name: Generate prefixPack
        run: |
          bash scripts/gen-prefixpack.sh \
            --wine-prefix /tmp/wine_build \
            --output dist/prefixPack.tar \
            --fonts "${{ github.workspace }}/fonts" \
            --workdir /tmp/prefix-gen

      - name: Package wcp + whp
        run: |
          mkdir -p dist
          bash scripts/package-wcp.sh /tmp/wine_build dist/prefixPack.tar \
            "dist/wine-${{ matrix.ver }}-x86_64.wcp" "${{ matrix.ver }}" x86_64
          bash scripts/package-whp.sh /tmp/wine_build dist/prefixPack.tar \
            "dist/wine-${{ matrix.ver }}.whp" "${{ matrix.ver }}" x86_64

      - name: Verify packages
        run: |
          set -e
          ls -lh dist/
          echo "=== whp ==="
          magic=$(xxd -l 4 -p dist/wine-${{ matrix.ver }}.whp)
          echo "  magic: ${magic}"
          [ "${magic}" = "28b52ffd" ] || { echo "ERROR: whp 外层不是 zstd"; exit 1; }
          zstd -dc dist/wine-${{ matrix.ver }}.whp | tar -tf - > /tmp/whp.lst
          grep -q "^wine-${{ matrix.ver }}-/bin/" /tmp/whp.lst || { echo "ERROR: whp 缺 wine 目录"; exit 1; }
          grep -q "^container-pattern-" /tmp/whp.lst || { echo "ERROR: whp 缺 container-pattern"; exit 1; }
          cp_size=$(zstd -dc dist/wine-${{ matrix.ver }}.whp | tar -xOf - "container-pattern-${{ matrix.ver }}.tzst" | wc -c)
          echo "  container-pattern: $((cp_size/1024/1024))MB"
          [ "${cp_size}" -gt 10485760 ] || { echo "ERROR: container-pattern 过小"; exit 1; }

          echo "=== 独立容器模板 ==="
          pat="dist/wine-${{ matrix.ver }}-x86_64_container_pattern.tzst"
          ls -lh "${pat}"
          pat_size=$(stat -c %s "${pat}")
          echo "  pattern: $((pat_size/1024/1024))MB"
          [ "${pat_size}" -gt 10485760 ] || { echo "ERROR: 独立容器模板过小"; exit 1; }

          echo "=== wcp ==="
          zstd -dc dist/wine-${{ matrix.ver }}-x86_64.wcp | tar -tf - > /tmp/wcp.lst
          grep -q "prefixPack.txz" /tmp/wcp.lst || { echo "ERROR: wcp 缺 prefixPack.txz"; exit 1; }
          grep -q "profile.json" /tmp/wcp.lst || { echo "ERROR: wcp 缺 profile.json"; exit 1; }
          txz_size=$(zstd -dc dist/wine-${{ matrix.ver }}-x86_64.wcp | tar -xOf - ./prefixPack.txz | wc -c)
          echo "  prefixPack.txz: $((txz_size/1024/1024))MB"
          [ "${txz_size}" -gt 10485760 ] || { echo "ERROR: prefixPack.txz 过小"; exit 1; }

      - name: Upload wcp
        uses: actions/upload-artifact@v4
        with:
          name: Wine-${{ matrix.ver }}-x86_64-zh
          path: dist/*.wcp
          retention-days: 30
          if-no-files-found: error

      - name: Upload whp
        uses: actions/upload-artifact@v4
        with:
          name: Wine-${{ matrix.ver }}-x86_64-zh-whp
          path: |
            dist/*.whp
            dist/*_container_pattern.tzst
          retention-days: 30
          if-no-files-found: error

  record:
    needs: [prepare, build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record built refs
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          REPO: ${{ inputs.wine_repo }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("state/built.json")
          data = json.loads(p.read_text()) if p.exists() else {"refs": {}}
          for it in json.loads(os.environ["MATRIX"])["include"]:
              data["refs"][f'{os.environ["REPO"]}@{it["ref"]}'] = it["ver"]
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/built.json
          git diff --cached --quiet || git commit -m "chore: 记录已构建版本"
          git push || true
